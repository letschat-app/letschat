spring.application.name=mvp_1
spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_UNAME}
spring.r2dbc.password=${DB_PASS}
spring.sql.init.mode=always


spring.webflux.multipart.max-in-memory-size:10MB
spring.main.web-application-type=reactive

server.address=0.0.0.0
server.port=${PORT:10000}

r2.accessKey=${R2_ACCESS_KEY}
r2.secretKey=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket=letschat-media

firebase.config=${FIREBASE_CONFIG}

# Brevo Mail Service Provider Configuration (REST API v3)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@letschat.com}
brevo.sender.name=${BREVO_SENDER_NAME:LetsChat}

# Public URL for the LetsChat logo embedded in transactional emails
letschat.app.logo-url=${APP_LOGO_URL:https://raw.githubusercontent.com/letschat-app/letschat-test-app/main/public/icon.png}
letschat.frontend.url=${FRONTEND_URL:http://localhost:5173}
letschat.app.download-url=${APP_DOWNLOAD_URL:https://letschat.com/download}


# SpringDoc OpenAPI Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
